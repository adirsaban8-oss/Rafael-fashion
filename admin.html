<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAFAEL · ניהול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#F3F1EC;--card:#fff;--ink:#1f1b16;--mid:#5b5246;--mute:#9a8f7e;--line:#e6e0d5;--gold:#a98b53;--shadow:0 6px 22px rgba(31,27,22,.06);
    --amber:#b5852f;--amber-bg:#fbf0da;--blue:#3a5a8a;--blue-bg:#e7eefb;--green:#3f7d50;--green-bg:#e8f0e9;--red:#b3473a;--red-bg:#f7e3e0}
  body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--ink);font-weight:300;line-height:1.55}
  .wrap{max-width:1140px;margin:0 auto;padding:1.3rem 1rem}
  header{background:rgba(243,241,236,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .head{max-width:1140px;margin:0 auto;padding:.85rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  .brand{font-family:'Frank Ruhl Libre',serif;font-size:1.4rem;font-weight:500;letter-spacing:.12em}
  .sub{color:var(--mute);font-size:.8rem}
  .spacer{flex:1}
  input,select{font-family:inherit;padding:.5rem .6rem;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:.88rem;color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--gold)}
  .btn{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-weight:500;padding:.5rem .9rem;font-size:.85rem;background:var(--ink);color:#fff;transition:opacity .2s}
  .btn:hover{opacity:.86}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem;margin-bottom:1.1rem;box-shadow:var(--shadow)}
  .card h2{font-family:'Frank Ruhl Libre',serif;font-size:1.3rem;font-weight:500;margin-bottom:.2rem}
  .muted{color:var(--mute);font-size:.86rem}
  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.1rem}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem;box-shadow:var(--shadow)}
  .kpi .n{font-family:'Frank Ruhl Libre',serif;font-size:1.9rem;font-weight:600}
  .kpi .l{color:var(--mute);font-size:.82rem}
  /* orders */
  .order{border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:.9rem}
  .order .top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
  .oid{font-weight:700}
  .when{color:var(--mute);font-size:.8rem}
  .badge{display:inline-block;font-size:.72rem;font-weight:600;padding:.2rem .6rem;border-radius:99px}
  .b-pending_cash{background:var(--amber-bg);color:var(--amber)}
  .b-pending_pickup_cash{background:var(--blue-bg);color:var(--blue)}
  .b-completed{background:var(--green-bg);color:var(--green)}
  .b-cancelled{background:var(--red-bg);color:var(--red)}
  .order .who{margin:.6rem 0;font-size:.9rem}
  .order .who b{font-weight:600}
  .items{font-size:.85rem;color:var(--mid);margin:.4rem 0}
  .totals{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.85rem;border-top:1px solid var(--line);padding-top:.6rem;margin-top:.4rem}
  .totals .g{font-weight:700;color:var(--ink)}
  /* catalog editor */
  .prodgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.9rem}
  .pcard{border:1px solid var(--line);border-radius:12px;padding:.9rem}
  .pcard .nm{font-weight:600}
  .pcard .ct{color:var(--mute);font-size:.78rem;margin-bottom:.5rem}
  .prow{display:flex;align-items:center;gap:.5rem;margin:.4rem 0}
  .prow label{font-size:.8rem;color:var(--mid);min-width:42px}
  .prow input{width:90px}
  .switch{position:relative;display:inline-block;width:46px;height:26px}
  .switch input{display:none}
  .slider{position:absolute;inset:0;background:#cdc6b8;border-radius:99px;transition:.2s;cursor:pointer}
  .slider:before{content:"";position:absolute;height:20px;width:20px;right:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked+.slider{background:var(--green)}
  .switch input:checked+.slider:before{transform:translateX(-20px)}
  .stk{font-size:.8rem;font-weight:500}
  .toast{position:fixed;bottom:1.3rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.3rem;border-radius:99px;font-size:.88rem;z-index:90;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}.toast.bad{background:var(--red)}
  @media(max-width:560px){ .totals{gap:.7rem} }
</style>
</head>
<body>
<header>
  <div class="head">
    <div><div class="brand">RAFAEL · ניהול</div><div class="sub">לוח הזמנות ומלאי</div></div>
    <div class="spacer"></div>
    <input id="token" placeholder="Admin token (אם הוגדר)" style="width:190px">
    <button class="btn ghost" onclick="loadAll()">רענן</button>
  </div>
</header>

<div class="wrap">
  <!-- KPIs -->
  <div class="kpis" id="kpis"></div>

  <!-- ORDERS -->
  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>הזמנות</h2>
      <span class="muted" id="ordMeta"></span>
    </div>
    <div id="orders" style="margin-top:.8rem"><div class="muted">טוען…</div></div>
  </section>

  <!-- CATALOG / INVENTORY -->
  <section class="card">
    <h2>קטלוג ומלאי</h2>
    <div class="muted" style="margin-bottom:.8rem">עריכת מחיר וסטטוס מלאי — משתקף מיד בחנות.</div>
    <div class="prodgrid" id="catalog"><div class="muted">טוען…</div></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
function $(id){return document.getElementById(id);}
function money(n){return '₪'+Number(n||0).toLocaleString();}
function toast(m,bad){var t=$('toast');t.textContent=m;t.className='toast show'+(bad?' bad':'');setTimeout(function(){t.className='toast';},2200);}
function hdrs(){var h={'Content-Type':'application/json'};var t=$('token').value.trim();if(t)h['x-admin-token']=t;return h;}
var STATUS_LABELS={pending_cash:'ממתין · מזומן לשליח',pending_pickup_cash:'ממתין · תשלום באיסוף',completed:'הושלמה',cancelled:'בוטלה'};

function loadAll(){ loadOrders(); loadCatalog(); }

/* ===== ORDERS ===== */
function loadOrders(){
  fetch('/api/admin/orders',{headers:hdrs()}).then(function(r){
    if(r.status===401){ throw new Error('גישה נדחתה — בדוק את ה-Admin token'); }
    return r.json();
  }).then(function(d){ renderOrders(d.orders||[]); })
  .catch(function(e){ $('orders').innerHTML='<div class="muted" style="color:var(--red)">'+(e.message||'שגיאה בטעינת הזמנות')+'</div>'; renderKpis([]); });
}
function renderOrders(list){
  renderKpis(list);
  $('ordMeta').textContent=list.length+' הזמנות';
  if(!list.length){ $('orders').innerHTML='<div class="muted">אין הזמנות עדיין. הזמנות מהחנות יופיעו כאן אוטומטית.</div>'; return; }
  $('orders').innerHTML=list.map(function(o){
    var addr=o.shippingMethod==='self_pickup'?'הבונים 3, נתניה (איסוף עצמי)':
      [o.customer.street,o.customer.houseNumber,o.customer.city].filter(Boolean).join(' ');
    var items=(o.items||[]).map(function(it){
      var sz=(!it.size||it.size==='ONE_SIZE')?'':' · מידה '+it.size;
      var cl=it.color?' · '+it.color:'';
      return it.name+cl+sz+' ×'+it.quantity;
    }).join(' | ');
    var when=o.createdAt?new Date(o.createdAt).toLocaleString('he-IL'):'';
    return '<div class="order"><div class="top">'+
      '<div><span class="oid">'+o.id+'</span> <span class="when">'+when+'</span></div>'+
      '<div style="display:flex;gap:.5rem;align-items:center">'+
        '<span class="badge b-'+o.status+'">'+(STATUS_LABELS[o.status]||o.status)+'</span>'+
        '<select onchange="setStatus(\''+o.id+'\',this.value)">'+
          ['pending_cash','pending_pickup_cash','completed','cancelled'].map(function(s){return '<option value="'+s+'"'+(o.status===s?' selected':'')+'>'+STATUS_LABELS[s]+'</option>';}).join('')+
        '</select>'+
      '</div></div>'+
      '<div class="who"><b>'+(o.customer.fullName||'')+'</b> · '+(o.customer.phone||'')+'<br><span class="muted">'+addr+'</span>'+(o.customer.notes?'<br><span class="muted">הערה: '+o.customer.notes+'</span>':'')+'</div>'+
      '<div class="items">'+items+'</div>'+
      '<div class="totals"><span>ביניים: '+money(o.subtotal)+'</span><span>משלוח: '+(o.shipping===0?'חינם':money(o.shipping))+'</span><span class="g">סה"כ: '+money(o.grandTotal)+'</span><span class="muted">'+(o.paymentLabel||'')+'</span></div>'+
    '</div>';
  }).join('');
}
function renderKpis(list){
  var total=list.length;
  var pending=list.filter(function(o){return o.status==='pending_cash'||o.status==='pending_pickup_cash';}).length;
  var completed=list.filter(function(o){return o.status==='completed';}).length;
  var revenue=list.filter(function(o){return o.status==='completed';}).reduce(function(s,o){return s+(Number(o.grandTotal)||0);},0);
  $('kpis').innerHTML=
    kpi(total,'הזמנות סה"כ')+kpi(pending,'ממתינות')+kpi(completed,'הושלמו')+kpi(money(revenue),'הכנסות (הושלמו)');
}
function kpi(n,l){return '<div class="kpi"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}
function setStatus(id,status){
  fetch('/api/admin/orders/'+id+'/status',{method:'POST',headers:hdrs(),body:JSON.stringify({status:status})})
  .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
  .then(function(res){ if(res.ok){ toast('הסטטוס עודכן'); loadOrders(); } else toast(res.d.error||'שגיאה',true); })
  .catch(function(){ toast('שגיאת תקשורת',true); });
}

/* ===== CATALOG / INVENTORY ===== */
function loadCatalog(){
  fetch('/api/catalog').then(function(r){return r.json();}).then(function(d){ renderCatalog(d.products||[]); })
  .catch(function(){ $('catalog').innerHTML='<div class="muted" style="color:var(--red)">שגיאה בטעינת קטלוג</div>'; });
}
function renderCatalog(list){
  $('catalog').innerHTML=list.map(function(p){
    var inStock=p.stockStatus!=='out_of_stock';
    return '<div class="pcard"><div class="nm">'+p.name+'</div><div class="ct">'+p.category+' · '+p.id+'</div>'+
      '<div class="prow"><label>מחיר</label><input type="number" id="price-'+p.id+'" value="'+p.price+'" min="0"> ₪</div>'+
      '<div class="prow"><label class="switch"><input type="checkbox" id="stock-'+p.id+'" '+(inStock?'checked':'')+'><span class="slider"></span></label>'+
        '<span class="stk" id="stklbl-'+p.id+'" style="color:'+(inStock?'var(--green)':'var(--red)')+'">'+(inStock?'במלאי':'אזל')+'</span></div>'+
      '<button class="btn" style="width:100%;margin-top:.5rem" onclick="saveProduct(\''+p.id+'\')">שמירה</button>'+
    '</div>';
  }).join('');
  list.forEach(function(p){
    var cb=$('stock-'+p.id);
    if(cb) cb.addEventListener('change',function(){ var on=cb.checked; var lbl=$('stklbl-'+p.id); lbl.textContent=on?'במלאי':'אזל'; lbl.style.color=on?'var(--green)':'var(--red)'; });
  });
}
function saveProduct(id){
  var price=Number($('price-'+id).value);
  var stockStatus=$('stock-'+id).checked?'in_stock':'out_of_stock';
  fetch('/api/admin/products/'+id,{method:'POST',headers:hdrs(),body:JSON.stringify({price:price,stockStatus:stockStatus})})
  .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
  .then(function(res){ if(res.ok){ toast('נשמר ✓'); } else toast(res.d.error||'שגיאה',true); })
  .catch(function(){ toast('שגיאת תקשורת',true); });
}

/* ===== boot + auto-refresh ===== */
loadAll();
setInterval(loadOrders, 7000);
</script>
</body>
</html>
